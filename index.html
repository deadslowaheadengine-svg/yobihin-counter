  function loadImg(src) {
    return new Promise((ok, ng) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => ng(new Error('decode'));
      im.src = src;
    });
  }
  // 大きい写真は半分ずつ縮める（ぎざぎざを防ぐ）
  function shrink(src, long) {
    let w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
    const s = Math.min(1, long / Math.max(w, h));
    const tw = Math.max(1, Math.round(w * s)), th = Math.max(1, Math.round(h * s));
    let cur = src;
    while (w / 2 > tw * 1.05) {
      w = Math.round(w / 2); h = Math.round(h / 2);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(cur, 0, 0, w, h);
      cur = c;
    }
    const c = document.createElement('canvas');
    c.width = tw; c.height = th;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(cur, 0, 0, tw, th);
    return c;
  }
  const frame = () => new Promise(r => {
    let done = false;
    const go = () => { if (!done) { done = true; r(); } };
    requestAnimationFrame(() => setTimeout(go, 0));
    setTimeout(go, 60);
  });

  function mount(root, opts = {}) {
    root.innerHTML = TEMPLATE(opts.emptyText || '「撮影する」か「写真を選ぶ」で、部品を真上から写した写真を開いてください。');
    const q = s => root.querySelector(s);
    const toast = opts.toast || (m => console.log(m));
    const cv = q('canvas'), stage = q('.c-stage'), ctx = cv.getContext('2d');
    const st = {
      src: null, disp: null, work: null, W: 0, H: 0, chip: '',
      P: null, S: null, R: null, maskCv: null, final: [], counts: { total: 0, auto: 0, added: 0, removed: 0 },
      opt: { sens: 50, msens: 50, minRatio: 0.4, split: true, edge: true, hires: false, refFrac: 0, bg: null, roi: null },
      method: 'auto', M: null, mbox: null,   // mbox は見本の箱（写真に対する割合）
      edits: { added: [], removed: [] }, undo: [], mode: 'edit', showMask: false,
    };
    const V = { s: 1, tx: 0, ty: 0, cw: 0, ch: 0, dpr: 1, fit: 1, atFit: true };
    let active = opts.active !== false;

    // ---------- 写真を開く ----------
    async function openFile(file) {
      if (!file) return;
      if (file.type && !file.type.startsWith('image/')) return toast('写真（画像）のファイルを選んでください', 'warn');
      const url = URL.createObjectURL(file);
      try {
        const im = await loadImg(url);
        setImage(im, '');
      } catch (e) {
        toast('この写真は読めませんでした。HEIC形式なら JPEG で保存し直すか、カメラの設定を「互換性優先」にしてください。', 'warn');
      } finally {
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
    }
    async function loadURL(url, chip) {
      try { setImage(await loadImg(url), chip || ''); } catch (e) { toast('写真を読み込めませんでした', 'warn'); }
    }
    function setImage(im, chip) {
      st.src = im; st.chip = chip;
      st.disp = shrink(im, 2400);
      st.opt.refFrac = 0; st.opt.bg = null; st.opt.roi = null;
      st.method = 'auto'; st.M = null; st.mbox = null;
      st.edits = { added: [], removed: [] }; st.undo = [];
      q('.c-empty').hidden = true;
      q('.c-chip').hidden = !chip;
      q('.c-chip').textContent = chip;
      stage.style.setProperty('--ar', `${st.disp.width} / ${st.disp.height}`);
      setMode('edit');
      V.atFit = true;
      run('load');
    }
    function clear() {
      token++;
      Object.assign(st, { src: null, disp: null, work: null, W: 0, H: 0, P: null, S: null, R: null, final: [], undo: [],
        counts: { total: 0, auto: 0, added: 0, removed: 0 } });
      st.edits = { added: [], removed: [] };
      st.opt.refFrac = 0; st.opt.bg = null; st.opt.roi = null;
      st.method = 'auto'; st.M = null; st.mbox = null;
      q('.c-empty').hidden = false;
      q('.c-chip').hidden = true;
      q('.c-busy').hidden = true;
      stage.style.removeProperty('--ar');
      panel();
      draw();
      emit();
    }

    // ---------- 数える ----------
    let token = 0;
    async function run(level) {
      if (!st.src) return;
      const my = ++token;
      if (level !== 'count') q('.c-busy').hidden = false;
      await frame();
      if (my !== token) return;
      try {
        if (level === 'load') {
          const c = shrink(st.src, st.opt.hires ? 2000 : 1280);
          st.W = c.width; st.H = c.height;
          st.work = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, st.W, st.H);
          fitView();
        }
        if (level === 'load' || level === 'prepare') st.P = CountEngine.prepare(st.work, { roi: roiPx(), bg: st.opt.bg });
        if (level === 'load' || level === 'prepare' || level === 'segment') st.S = CountEngine.segment(st.P, { sens: st.method === 'auto' ? st.opt.sens : 50 });
        if (level !== 'pick') st.R = CountEngine.count(st.P, st.S, {
          minRatio: st.opt.minRatio, split: st.opt.split, edge: st.opt.edge,
          refArea: st.opt.refFrac ? st.opt.refFrac * st.W * st.H : 0,
        });
        if (st.method === 'match' && st.mbox && (!st.M || level === 'load')) {
          const b = st.mbox;
          st.M = CountEngine.match(st.work, { x0: b.u0 * st.W, y0: b.v0 * st.H, x1: b.u1 * st.W, y1: b.v1 * st.H });
        }
        buildMask();
        rebuild();
      } catch (e) {
        console.error(e);
        toast('数える途中で問題が起きました（' + e.message + '）', 'warn');
      } finally {
        if (my === token) q('.c-busy').hidden = true;
      }
    }
    const roiPx = () => (st.opt.roi ? { x0: st.opt.roi.u0 * st.W, y0: st.opt.roi.v0 * st.H, x1: st.opt.roi.u1 * st.W, y1: st.opt.roi.v1 * st.H } : null);

    // 手直し（足した・消した印）は写真に対する割合で持つので、解析をやり直しても残る
    const tau = () => 0.75 - 0.5 * st.opt.msens / 100;   // 形で探すときの「似ている度合い」の下限（感度50で0.5）
    function baseMarkers() {
      if (st.method === 'match' && st.M) {
        const r = roiPx();
        return CountEngine.pickMatches(st.M, tau())
          .filter(m => !r || (m.x >= r.x0 && m.x < r.x1 && m.y >= r.y0 && m.y < r.y1))
          .map(m => ({ x: m.x, y: m.y, clump: false }));
      }
      return st.R ? st.R.markers : [];
    }
    function refArea() {
      if (st.method === 'match' && st.mbox) { const m = 0.8 * Math.min((st.mbox.u1 - st.mbox.u0) * st.W, (st.mbox.v1 - st.mbox.v0) * st.H); return m * m; }
      return (st.R && st.R.ref) || 400;
    }
    function rebuild() {
      const R = st.R, W = st.W, H = st.H;
      if (!R) return;
      const ref = refArea();
      const supR = Math.max(6, 0.45 * Math.sqrt(ref));
      const sup = st.edits.removed.map(p => [p.u * W, p.v * H]);
      const all = [];
      let removed = 0;
      const base = baseMarkers();
      for (const m of base) {
        if (sup.some(([x, y]) => (x - m.x) ** 2 + (y - m.y) ** 2 < supR * supR)) { removed++; continue; }
        all.push({ x: m.x, y: m.y, kind: m.clump ? 'clump' : 'one' });
      }
      for (const p of st.edits.added) all.push({ x: p.u * W, y: p.v * H, kind: 'add', ref: p });
      const band = Math.max(8, 0.9 * Math.sqrt(ref));
      all.sort((a, b) => (Math.floor(a.y / band) - Math.floor(b.y / band)) || (a.x - b.x));
      all.forEach((m, i) => { m.n = i + 1; });
      st.final = all;
      st.counts = { total: all.length, auto: base.length, removed, added: st.edits.added.length };
      panel();
      draw();
      emit();
    }
    function emit() { if (opts.onChange) opts.onChange(api.counts()); }

    function buildMask() {
      const { W, H, S, R } = st;
      const c = st.maskCv || document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      const im = x.createImageData(W, H), d = im.data;
      const pal = { 1: [34, 190, 100], 2: [255, 150, 40], 3: [150, 150, 150], 4: [235, 50, 50] };
      for (let i = 0; i < W * H; i++) {
        const k = S.labels[i];
        if (!k) continue;
        const p = pal[R.status[k]];
        if (!p) continue;
        d[i * 4] = p[0]; d[i * 4 + 1] = p[1]; d[i * 4 + 2] = p[2]; d[i * 4 + 3] = 115;
      }
      x.putImageData(im, 0, 0);
      st.maskCv = c;
    }

    // ---------- 右の欄 ----------
    function panel() {
      const c = st.counts;
      const has = !!st.R;
      q('[data-total]').textContent = has ? c.total : '–';
      q('.c-readout b').textContent = has ? c.total : '–';
      const parts = [];
      const isM = st.method === 'match';
      if (has) {
        parts.push(isM ? `形で見つけた ${c.auto}` : `自動 ${c.auto}`);
        if (c.added) parts.push(`手で足した ＋${c.added}`);
        if (c.removed) parts.push(`消した −${c.removed}`);
        if (!isM && st.R.clumps) parts.push(`くっつき ${st.R.clumps}か所（${st.R.clumpObjs}個分）`);
      }
      q('.c-break').textContent = parts.join('　');
      const canUndo = st.undo.length > 0;
      q('[data-act="undo"]').disabled = !canUndo;
      q('.c-undo').disabled = !canUndo;
      q('[data-act="reset"]').disabled = !(st.edits.added.length || st.edits.removed.length);
      q('[data-act="copy"]').disabled = !has;
      const notes = q('.c-notes');
      notes.textContent = '';
      const warns = !has ? [] : isM ? [c.auto <= 1 ? 'matchFew' : 'match'] : st.R.warnings.concat(st.R.warnings.includes('none') ? [] : ['tryMatch']);
      for (const w of warns) {
        const n = NOTE[w];
        if (!n) continue;
        const li = document.createElement('li');
        if (n[0]) li.className = n[0];
        li.textContent = n[1];
        notes.appendChild(li);
      }
      const R = st.R;
      const pct = R && R.ref ? Math.round(100 * R.ref / (st.W * st.H) * 100) / 100 : 0;
      q('[data-t="ref"]').textContent = st.opt.refFrac ? `1個の大きさ：見本から（写真の ${pct}%）` : `1個の大きさ：自動${pct ? `（写真の ${pct}%）` : ''}`;
      q('[data-act="refAuto"]').hidden = !st.opt.refFrac;
      q('[data-t="bg"]').textContent = st.opt.bg ? '背景の色：タップした色' : '背景の色：自動（いちばん多い色）';
      q('[data-act="bgAuto"]').hidden = !st.opt.bg;
      q('[data-t="roi"]').textContent = st.opt.roi ? '数える範囲：囲んだ中だけ' : '数える範囲：写真全体';
      q('[data-act="roiClear"]').hidden = !st.opt.roi;
      q('[data-t="method"]').textContent = isM ? '数え方：見本と同じ形を探す' : '数え方：背景との色の差';
      q('[data-act="toAuto"]').hidden = !isM;
      q('[data-t="sensScale"]').textContent = isM ? 'よく似たものだけ' : 'はっきりした所だけ';
      q('[data-t="sensScale2"]').textContent = isM ? '少し違っても数える' : 'うすい部品も拾う';
      ['#c-minr', '#c-split', '#c-edge', '#c-mask'].forEach(id => { q(id).disabled = isM; });
      const sv = isM ? st.opt.msens : st.opt.sens;
      if (+q('#c-sens').value !== sv) q('#c-sens').value = sv;
      q('[data-o="sens"]').textContent = sv;
      q('.c-legend .clump').parentElement.hidden = isM;
    }

    // ---------- 表示（拡大・移動） ----------
    function sizeCanvas() {
      const r = stage.getBoundingClientRect();
      V.cw = r.width; V.ch = r.height;
      V.dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(V.cw * V.dpr));
      cv.height = Math.max(1, Math.round(V.ch * V.dpr));
    }
    function fitView() {
      if (!st.W || !V.cw) return;
      V.fit = Math.min(V.cw / st.W, V.ch / st.H);
      V.s = V.fit;
      V.tx = (V.cw - st.W * V.s) / 2;
      V.ty = (V.ch - st.H * V.s) / 2;
      V.atFit = true;
    }
    function zoomAt(f, px, py) {
      if (!st.W) return;
      const ns = clamp(V.s * f, V.fit * 0.9, Math.max(V.fit * 12, 4));
      const ix = (px - V.tx) / V.s, iy = (py - V.ty) / V.s;
      V.s = ns;
      V.tx = px - ix * ns; V.ty = py - iy * ns;
      V.atFit = false;
      clampPan();
      draw();
    }
    function clampPan() {
      const iw = st.W * V.s, ih = st.H * V.s;
      V.tx = clamp(V.tx, Math.min(V.cw / 2 - iw, (V.cw - iw) / 2), Math.max(V.cw / 2, (V.cw - iw) / 2));
      V.ty = clamp(V.ty, Math.min(V.ch / 2 - ih, (V.ch - ih) / 2), Math.max(V.ch / 2, (V.ch - ih) / 2));
    }
    const markerR = () => clamp(0.3 * Math.sqrt(refArea()) * V.s, 5, 15);

    let drawQ = 0;
    function draw() {
      if (drawQ) return;
      drawQ = requestAnimationFrame(paint);
      setTimeout(() => { if (drawQ) { cancelAnimationFrame(drawQ); paint(); } }, 120);
    }
    function paint() {
      drawQ = 0;
      const d = V.dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (!st.disp || !st.W) return;
      ctx.setTransform(d * V.s, 0, 0, d * V.s, d * V.tx, d * V.ty);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(st.disp, 0, 0, st.W, st.H);
      if (st.showMask && st.maskCv && st.method !== 'match') ctx.drawImage(st.maskCv, 0, 0, st.W, st.H);
      const dragBox = drag && drag.roi && st.mode === 'sample' ? drag.roi : null;
      const mb = dragBox || (st.method === 'match' && st.mbox ? { x0: st.mbox.u0 * st.W, y0: st.mbox.v0 * st.H, x1: st.mbox.u1 * st.W, y1: st.mbox.v1 * st.H } : null);
      if (mb) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5 / V.s;
        ctx.setLineDash([7 / V.s, 5 / V.s]);
        ctx.strokeRect(Math.min(mb.x0, mb.x1), Math.min(mb.y0, mb.y1), Math.abs(mb.x1 - mb.x0), Math.abs(mb.y1 - mb.y0));
        ctx.setLineDash([]);
      }
      const roi = drag && drag.roi && st.mode === 'roi' ? drag.roi : st.opt.roi ? { x0: st.opt.roi.u0 * st.W, y0: st.opt.roi.v0 * st.H, x1: st.opt.roi.u1 * st.W, y1: st.opt.roi.v1 * st.H } : null;
      if (roi) {
        const x0 = Math.min(roi.x0, roi.x1), y0 = Math.min(roi.y0, roi.y1), w = Math.abs(roi.x1 - roi.x0), h = Math.abs(roi.y1 - roi.y0);
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.beginPath();
        ctx.rect(0, 0, st.W, st.H);
        ctx.rect(x0, y0, w, h);
        ctx.fill('evenodd');
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2 / V.s;
        ctx.setLineDash([8 / V.s, 6 / V.s]);
        ctx.strokeRect(x0, y0, w, h);
        ctx.setLineDash([]);
      }
      ctx.setTransform(d, 0, 0, d, 0, 0);
      const r = markerR(), num = r >= 9;
      ctx.font = `700 ${Math.round(r * 1.05)}px ${getComputedStyle(root).fontFamily}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const m of st.final) {
        const x = V.tx + m.x * V.s, y = V.ty + m.y * V.s;
        if (x < -r || y < -r || x > V.cw + r || y > V.ch + r) continue;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = COL[m.kind];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        if (num) {
          ctx.fillStyle = '#fff';
          ctx.fillText(String(m.n), x, y + 0.5);
        }
      }
    }

    // ---------- タップ・なぞり・ピンチ ----------
    const ptrs = new Map();
    let drag = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const toImg = (px, py) => [(px - V.tx) / V.s, (py - V.ty) / V.s];
    cv.addEventListener('pointerdown', e => {
      if (!st.W) return;
      cv.setPointerCapture(e.pointerId);
      const [x, y] = pos(e);
      ptrs.set(e.pointerId, [x, y]);
      if (ptrs.size === 1) {
        drag = { kind: 'one', sx: x, sy: y, t: performance.now(), tx: V.tx, ty: V.ty, moved: false, roi: null };
      } else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        drag = { kind: 'pinch', d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, m0: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s0: V.s, tx: V.tx, ty: V.ty };
      }
    });
    cv.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId) || !drag) return;
      const [x, y] = pos(e);
      ptrs.set(e.pointerId, [x, y]);
      if (drag.kind === 'pinch' && ptrs.size >= 2) {
        const [a, b] = [...ptrs.values()];
        const dd = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const ns = clamp(drag.s0 * dd / drag.d0, V.fit * 0.9, Math.max(V.fit * 12, 4));
        const ix = (drag.m0[0] - drag.tx) / drag.s0, iy = (drag.m0[1] - drag.ty) / drag.s0;
        V.s = ns; V.tx = m[0] - ix * ns; V.ty = m[1] - iy * ns; V.atFit = false;
        clampPan();
        draw();
      } else if (drag.kind === 'one') {
        const dx = x - drag.sx, dy = y - drag.sy;
        if (!drag.moved && Math.hypot(dx, dy) > 7) drag.moved = true;
        if (!drag.moved) return;
        if ((st.mode === 'roi' || st.mode === 'sample') && !drag.noRoi) {
          const a = toImg(drag.sx, drag.sy), b = toImg(x, y);
          drag.roi = { x0: a[0], y0: a[1], x1: b[0], y1: b[1] };
        } else {
          V.tx = drag.tx + dx; V.ty = drag.ty + dy; V.atFit = false;
          clampPan();
        }
        draw();
      }
    });
    function endPtr(e, cancel) {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (!drag) return;
      if (drag.kind === 'one' && !cancel) {
        if (!drag.moved && performance.now() - drag.t < 800) tap(drag.sx, drag.sy);
        else if (drag.roi && st.mode === 'sample') finishSample(drag.roi);
        else if (drag.roi) finishRoi(drag.roi);
      }
      if (drag.kind === 'pinch' && ptrs.size === 1) {
        const [p] = [...ptrs.values()];
        drag = { kind: 'one', sx: p[0], sy: p[1], t: 0, tx: V.tx, ty: V.ty, moved: true, roi: null, noRoi: true };
        return;
      }
      if (!ptrs.size) { drag = null; draw(); }
    }
    cv.addEventListener('pointerup', e => endPtr(e, false));
    cv.addEventListener('pointercancel', e => endPtr(e, true));
    cv.addEventListener('wheel', e => {
      if (!st.W) return;
      e.preventDefault();
      const [x, y] = pos(e);
      zoomAt(Math.exp(-clamp(e.deltaY, -120, 120) * 0.0022), x, y);
    }, { passive: false });

    function tap(px, py) {
      const [x, y] = toImg(px, py);
      if (x < 0 || y < 0 || x >= st.W || y >= st.H || !st.R) return;
      if (st.mode === 'edit') return toggleAt(x, y);
      if (st.mode === 'sample') {
        const c = CountEngine.compAt(st.S, st.W, st.H, x, y, 8);
        const ref = (st.R && st.R.ref) || 0;
        let b;
        if (c && (!ref || c.area < 1.6 * ref)) {
          const m = 0.06 * Math.max(c.x1 - c.x0, c.y1 - c.y0) + 2;
          b = { x0: c.x0 - m, y0: c.y0 - m, x1: c.x1 + 1 + m, y1: c.y1 + 1 + m };
        } else if (c && ref) {   // くっついたかたまり：1個分の大きさの四角
          const h = 0.65 * Math.sqrt(ref);
          b = { x0: x - h, y0: y - h, x1: x + h, y1: y + h };
        } else return toast('部品の上をタップするか、1個を指で四角く囲んでください', 'warn');
        finishSample(b);
        return;
      }
      if (st.mode === 'bg') {
        const lab = CountEngine.colorAt(st.P, x, y, 5);
        if (!lab) return;
        st.opt.bg = lab;
        st.method = 'auto'; st.M = null; st.mbox = null;
        setMode('edit');
        run('prepare').then(() => toast('タップした色を背景として数え直しました'));
      }
    }
    function finishSample(r) {
      const x0 = clamp(Math.min(r.x0, r.x1), 0, st.W), x1 = clamp(Math.max(r.x0, r.x1), 0, st.W);
      const y0 = clamp(Math.min(r.y0, r.y1), 0, st.H), y1 = clamp(Math.max(r.y0, r.y1), 0, st.H);
      if (x1 - x0 < 8 || y1 - y0 < 8) { toast('もう少し大きく囲んでください', 'warn'); return; }
      if ((x1 - x0) * (y1 - y0) > 0.25 * st.W * st.H) { toast('見本は1個だけを囲んでください（大きすぎます）', 'warn'); return; }
      st.mbox = { u0: x0 / st.W, v0: y0 / st.H, u1: x1 / st.W, v1: y1 / st.H };
      st.method = 'match';
      st.M = null;
      setMode('edit');
      run('pick').then(() => toast(`見本と同じ形のものを探しました：${st.final.length}個`));
    }
    function finishRoi(r) {
      const x0 = clamp(Math.min(r.x0, r.x1), 0, st.W), x1 = clamp(Math.max(r.x0, r.x1), 0, st.W);
      const y0 = clamp(Math.min(r.y0, r.y1), 0, st.H), y1 = clamp(Math.max(r.y0, r.y1), 0, st.H);
      if (x1 - x0 < 24 || y1 - y0 < 24) { toast('もう少し大きく囲んでください', 'warn'); return; }
      st.opt.roi = { u0: x0 / st.W, v0: y0 / st.H, u1: x1 / st.W, v1: y1 / st.H };
      setMode('edit');
      run('prepare').then(() => toast('囲んだ中だけで数え直しました'));
    }
    function toggleAt(x, y) {
      const hit = Math.max(markerR(), 16) / V.s;
      let best = null, bd = hit * hit;
      for (const m of st.final) {
        const d = (m.x - x) ** 2 + (m.y - y) ** 2;
        if (d < bd) { bd = d; best = m; }
      }
      if (best && best.kind === 'add') {
        st.edits.added = st.edits.added.filter(p => p !== best.ref);
        st.undo.push({ t: 'unadd', p: best.ref });
      } else if (best) {
        const p = { u: best.x / st.W, v: best.y / st.H };
        st.edits.removed.push(p);
        st.undo.push({ t: 'remove', p });
      } else {
        const p = { u: x / st.W, v: y / st.H };
        st.edits.added.push(p);
        st.undo.push({ t: 'add', p });
      }
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* なし */ } }
      rebuild();
    }
    function undo() {
      const a = st.undo.pop();
      if (!a) return;
      if (a.t === 'add') st.edits.added = st.edits.added.filter(p => p !== a.p);
      if (a.t === 'remove') st.edits.removed = st.edits.removed.filter(p => p !== a.p);
      if (a.t === 'unadd') st.edits.added.push(a.p);
      rebuild();
    }
    function setMode(m) {
      st.mode = m;
      stage.dataset.mode = m;
      root.querySelectorAll('.c-mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
      q('.c-hint').textContent = HINT[m];
    }

    // ---------- 印つきの画像 ----------
    function renderResult(o = {}) {
      if (!st.disp || !st.R) return Promise.resolve(null);
      const maxSide = o.maxSide || 2400;
      const s0 = Math.min(1, maxSide / Math.max(st.disp.width, st.disp.height));
      const PW = Math.round(st.disp.width * s0), PH = Math.round(st.disp.height * s0);
      const k = PW / st.W;
      const head = Math.round(Math.max(64, PW * 0.065));
      const c = document.createElement('canvas');
      c.width = PW; c.height = PH + head;
      const x = c.getContext('2d');
      x.fillStyle = '#1d2433';
      x.fillRect(0, 0, c.width, head);
      x.imageSmoothingQuality = 'high';
      x.drawImage(st.disp, 0, head, PW, PH);
      const fam = getComputedStyle(root).fontFamily;
      x.fillStyle = '#ffffff';
      x.textBaseline = 'alphabetic';
      x.font = `700 ${Math.round(head * 0.62)}px ${fam}`;
      const t1 = `${st.final.length} 個`;
      x.fillText(t1, head * 0.3, head * 0.74);
      const tw = x.measureText(t1).width, tx = head * 0.3 + tw + head * 0.45, room = c.width - tx - head * 0.3;
      x.font = `700 ${Math.round(head * 0.27)}px ${fam}`;
      x.fillText(o.title || '（品名なし）', tx, head * 0.44, room);
      x.font = `${Math.round(head * 0.22)}px ${fam}`;
      x.fillStyle = '#c9d3e3';
      const parts = [o.when || stamp(), `${st.method === 'match' ? '見本と同じ形' : '自動'} ${st.counts.auto}`];
      if (st.counts.added) parts.push(`手で足した +${st.counts.added}`);
      if (st.counts.removed) parts.push(`消した -${st.counts.removed}`);
      if (o.sub) parts.unshift(o.sub);
      x.fillText(parts.join('　'), tx, head * 0.8, room);
      const r = clamp(0.3 * Math.sqrt(refArea()) * k, 6, 40);
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.font = `700 ${Math.round(r * 1.05)}px ${fam}`;
      for (const m of st.final) {
        const px = m.x * k, py = m.y * k + head;
        x.beginPath();
        x.arc(px, py, r, 0, Math.PI * 2);
        x.fillStyle = COL[m.kind];
        x.fill();
        x.lineWidth = Math.max(2, r * 0.16);
        x.strokeStyle = '#fff';
        x.stroke();
        if (r >= 8) {
          x.fillStyle = '#fff';
          x.fillText(String(m.n), px, py + 0.5);
        }
      }
      return new Promise(ok => c.toBlob(ok, 'image/jpeg', o.quality || 0.9));
    }

    async function copyCount() {
      const t = String(st.final.length);
      try {
        await navigator.clipboard.writeText(t);
        toast(`「${t}」をコピーしました`);
      } catch (e) {
        const r = document.createRange();
        r.selectNodeContents(q('[data-total]'));
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
        toast('数字を選びました。コピーしてください', 'warn');
      }
    }

    // ---------- つなぎ ----------
    root.querySelectorAll('[data-file]').forEach(inp => inp.addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; }));
    root.querySelectorAll('.c-mode').forEach(b => b.addEventListener('click', () => {
      setMode(b.dataset.mode);
      if (b.dataset.mode !== 'edit') toast(HINT[b.dataset.mode]);
    }));
    root.querySelectorAll('.c-zoom [data-z]').forEach(b => b.addEventListener('click', () => zoomAt(b.dataset.z > 0 ? 1.6 : 1 / 1.6, V.cw / 2, V.ch / 2)));
    q('[data-fit]').addEventListener('click', () => { fitView(); draw(); });
    q('[data-act="undo"]').addEventListener('click', undo);
    q('.c-undo').addEventListener('click', undo);
    q('[data-act="reset"]').addEventListener('click', () => {
      st.edits = { added: [], removed: [] };
      st.undo = [];
      rebuild();
      toast('手直しを消して、自動で数えた結果に戻しました');
    });
    q('[data-act="copy"]').addEventListener('click', copyCount);
    let tSl = 0;
    const later = (lv, ms = 160) => { clearTimeout(tSl); tSl = setTimeout(() => run(lv), ms); };
    q('#c-sens').addEventListener('input', e => {
      q('[data-o="sens"]').textContent = e.target.value;
      if (st.method === 'match') { st.opt.msens = +e.target.value; if (st.M) rebuild(); }
      else { st.opt.sens = +e.target.value; later('segment'); }
    });
    q('#c-minr').addEventListener('input', e => { st.opt.minRatio = e.target.value / 100; q('[data-o="minr"]').textContent = `1個の${e.target.value}%未満`; later('count', 60); });
    q('#c-split').addEventListener('change', e => { st.opt.split = e.target.checked; run('count'); });
    q('#c-edge').addEventListener('change', e => { st.opt.edge = e.target.checked; run('count'); });
    q('#c-hires').addEventListener('change', e => { st.opt.hires = e.target.checked; run('load'); });
    q('#c-mask').addEventListener('change', e => { st.showMask = e.target.checked; draw(); });
    q('[data-act="refAuto"]').addEventListener('click', () => { st.opt.refFrac = 0; run('count'); });
    q('[data-act="toAuto"]').addEventListener('click', () => { st.method = 'auto'; st.M = null; st.mbox = null; run('segment'); toast('背景との色の差で数え直しました'); });
    q('[data-act="bgAuto"]').addEventListener('click', () => { st.opt.bg = null; run('prepare'); });
    q('[data-act="roiClear"]').addEventListener('click', () => { st.opt.roi = null; run('prepare'); });

    window.addEventListener('keydown', e => {
      if (!active || !st.W) return;
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if (e.key === '+' || e.key === '=') zoomAt(1.4, V.cw / 2, V.ch / 2);
      else if (e.key === '-') zoomAt(1 / 1.4, V.cw / 2, V.ch / 2);
      else if (e.key === '0') { fitView(); draw(); }
      else if (e.key === 'Escape') setMode('edit');
    });
    // 写真を落とす・貼り付ける
    let dragDepth = 0;
    const hasFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
    window.addEventListener('dragenter', e => { if (active && hasFiles(e)) { dragDepth++; q('.c-drop').hidden = false; e.preventDefault(); } });
    window.addEventListener('dragover', e => { if (active && hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) q('.c-drop').hidden = true; });
    window.addEventListener('drop', e => {
      dragDepth = 0; q('.c-drop').hidden = true;
      if (!active) return;
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) { e.preventDefault(); openFile(f); }
    });
    window.addEventListener('paste', e => {
      if (!active) return;
      const f = e.clipboardData && [...e.clipboardData.files].find(x => x.type.startsWith('image/'));
      if (f) openFile(f);
    });

    const ro = new ResizeObserver(() => {
      const was = V.atFit, cx = V.cw / 2, cy = V.ch / 2;
      const ix = (cx - V.tx) / V.s, iy = (cy - V.ty) / V.s;
      sizeCanvas();
      if (!st.W || !V.cw) return draw();
      V.fit = Math.min(V.cw / st.W, V.ch / st.H);
      if (was) fitView();
      else { V.tx = V.cw / 2 - ix * V.s; V.ty = V.ch / 2 - iy * V.s; clampPan(); }
      draw();
    });
    ro.observe(stage);
    sizeCanvas();
    setMode('edit');
    panel();

    const api = {
      slot: q('.c-slot'),
      openFile, loadURL, clear, renderResult,
      hasImage: () => !!st.src,
      counts: () => ({ ...st.counts, total: st.R ? st.final.length : 0, ready: !!st.R, clumps: st.R && st.method !== 'match' ? st.R.clumps : 0, method: st.method }),
      setActive(b) { active = b; },
      setEmptyText(t) { q('.c-empty').textContent = t; },
    };
    return api;
  }
  return { mount };
})();

  const $ = s => document.querySelector(s);
  let toastT = 0;
  function toast(msg, cls) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (cls ? ' ' + cls : '');
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, cls ? 5200 : 2600);
  }
  const counter = CounterUI.mount($('#counter'), { toast, emptyText: '見本の写真を読み込んでいます…' });
  counter.slot.appendChild($('#saveCard').content.cloneNode(true));

  // 保存：claude.ai の中ではダウンロードの許可を使う。ファイルで開いたときは普通のダウンロード
  let dl = null;
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  })();
  const pad = n => String(n).padStart(2, '0');
  function fileStamp() {
    const d = new Date();
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  }
  $('#saveImg').addEventListener('click', async () => {
    const memo = $('#memo').value.trim();
    const blob = await counter.renderResult({ title: memo });
    if (!blob) return toast('先に写真を開いて数えてください', 'warn');
    const safe = memo.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
    const name = `数えた結果_${fileStamp()}${safe ? '_' + safe : ''}_${counter.counts().total}個.jpg`;
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); toast('保存しました'); return; }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') return toast('少し待ってから、もう一度押してください', 'warn');
      }
    }
    if (window.claude) return showSheet(blob, null);
    // スマホ：画像を見せて「共有・保存」から写真アプリへ（長押しでも保存できる）
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return showSheet(blob, file);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    toast('保存しました');
  });
  let shareFile = null;
  function showSheet(blob, file) {
    const img = $('#sheetImg');
    if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    img.dataset.url = URL.createObjectURL(blob);
    img.src = img.dataset.url;
    shareFile = file;
    $('#sheetShare').hidden = !file;
    $('#sheetMsg').textContent = file
      ? '「共有・保存」から「画像を保存」を選ぶと、写真アプリに入ります（画像の長押しでも保存できます）'
      : '画像を長押し（右クリック）して保存してください';
    $('#sheet').hidden = false;
  }
  $('#sheetShare').addEventListener('click', async () => {
    if (!shareFile) return;
    try { await navigator.share({ files: [shareFile], title: shareFile.name }); }
    catch (e) { if (!e || e.name !== 'AbortError') toast('共有できませんでした。画像を長押しして保存してください', 'warn'); }
  });
  $('#sheetClose').addEventListener('click', () => { $('#sheet').hidden = true; });
  counter.loadURL(SAMPLE, '見本の写真').catch(() => counter.setEmptyText('「撮影する」か「写真を選ぶ」から始めてください'));
})();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
