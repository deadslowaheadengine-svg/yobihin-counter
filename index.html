<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f5597">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="部品カウンタ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>予備品カウンタ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 共通の土台：色は「在庫管理」アプリの青にそろえる。カウンタ単体と予備品台帳の両方で使う */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #1d2433; --sub: #5d6a7e; --line: #d5dbe5;
  --pri: #2f5597; --pri-ink: #ffffff; --pri-soft: #e3eaf6; --stage: #1b222d; --stage-ink: #e9eef5;
  --ok: #1f7a45; --ok-bg: #e2f3e8; --warn: #b3352a; --warn-bg: #fbeae8; --amber: #8a5a00; --amber-bg: #fff1d1;
  --note-bg: #fff5de; --note-ink: #6a4a00;
  --f-text: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, system-ui, sans-serif;
  --f-num: "Barlow Condensed", "DIN Condensed", "DIN Alternate", "Arial Narrow", var(--f-text);
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #171e29; --surface-2: #1d2532; --ink: #e6ebf2; --sub: #9aa6b8; --line: #2c3646;
    --pri: #8fb0ec; --pri-ink: #0f141c; --pri-soft: #22304a; --stage: #090d13; --stage-ink: #e9eef5;
    --ok: #4fd08a; --ok-bg: #173325; --warn: #ff8172; --warn-bg: #3a1f1c; --amber: #f1c46b; --amber-bg: #3a2e12;
    --note-bg: #332a12; --note-ink: #f2d48b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --surface-2: #1d2532; --ink: #e6ebf2; --sub: #9aa6b8; --line: #2c3646;
  --pri: #8fb0ec; --pri-ink: #0f141c; --pri-soft: #22304a; --stage: #090d13; --stage-ink: #e9eef5;
  --ok: #4fd08a; --ok-bg: #173325; --warn: #ff8172; --warn-bg: #3a1f1c; --amber: #f1c46b; --amber-bg: #3a2e12;
  --note-bg: #332a12; --note-ink: #f2d48b;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, .btn:focus-within, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--pri); outline-offset: 2px; }
a { color: var(--pri); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 9px; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; min-height: 44px; line-height: 1.3; text-align: center; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):hover { filter: brightness(1.05); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
details.card > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 28px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "＋"; color: var(--pri); font-weight: 700; }
details.card[open] > summary::after { content: "−"; }
details.card[open] > summary { margin-bottom: 8px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 11px; font-size: 16px; min-height: 44px; }
textarea.inp { min-height: 120px; resize: vertical; line-height: 1.4; }
.lbl { display: block; font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 30; max-width: min(92vw, 520px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.toast.warn { background: var(--warn); color: #fff; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8, 11, 16, .88); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #fff; font-size: 14px; }
.sheet img { width: 100%; height: 100%; min-height: 0; object-fit: contain; border-radius: 6px; }

/* 写真で数える部品（左に写真の台、右に数の読み取りと調整） */
.c-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 18px; align-items: start; }
.c-stagecol { min-width: 0; display: grid; gap: 10px; }
.c-shoot { display: flex; gap: 8px; flex-wrap: wrap; }
.c-stage { position: relative; width: 100%; aspect-ratio: var(--ar, 4 / 3); max-height: min(74vh, 860px); background: var(--stage);
  border-radius: var(--r); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.c-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.c-stage[data-mode="roi"] canvas { cursor: cell; }
.c-ov { position: absolute; z-index: 2; }
.c-readout { left: 10px; top: 10px; background: rgba(12, 16, 22, .78); color: #fff; border-radius: 9px; padding: 4px 12px 5px;
  display: flex; align-items: baseline; gap: 4px; pointer-events: none; }
.c-readout b { font: 700 40px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.c-readout span { font-size: 14px; font-weight: 700; }
.c-chip { right: 10px; top: 10px; background: rgba(255, 255, 255, .92); color: #1d2433; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 4px 10px; pointer-events: none; max-width: 60%; }
.c-zoom { right: 10px; bottom: 10px; display: flex; gap: 6px; }
.c-zoom button, .c-undo { background: rgba(12, 16, 22, .74); color: #fff; border: 1px solid rgba(255, 255, 255, .22); border-radius: 8px;
  min-width: 44px; height: 44px; padding: 0 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
.c-zoom button[data-z] { font-size: 22px; line-height: 1; }
.c-undo { left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; }
.c-undo:disabled { opacity: .35; }
.c-undo svg { width: 18px; height: 18px; }
.c-busy { inset: 0; display: grid; place-items: center; background: rgba(10, 14, 20, .45); color: #fff; font-weight: 700; }
.c-busy > div { display: flex; align-items: center; gap: 10px; background: rgba(10, 14, 20, .8); padding: 10px 16px; border-radius: 99px; }
.c-spin { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, .3); border-top-color: #fff; border-radius: 50%; animation: c-spin .8s linear infinite; }
@keyframes c-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .c-spin { animation-duration: 2.4s; } }
.c-empty { inset: 0; display: grid; place-items: center; color: var(--stage-ink); text-align: center; padding: 20px; line-height: 1.7; }
.c-drop { inset: 0; display: grid; place-items: center; background: rgba(47, 85, 151, .55); color: #fff; font-weight: 700; font-size: 18px; border: 3px dashed #fff; border-radius: var(--r); }
.c-modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 5px; }
.c-mode { border: 0; background: transparent; border-radius: 7px; padding: 8px 6px; font-size: 13px; font-weight: 700; color: var(--sub); cursor: pointer; min-height: 44px; line-height: 1.25; }
.c-mode[aria-pressed="true"] { background: var(--pri); color: var(--pri-ink); }
.c-hint { margin: 0; color: var(--sub); font-size: 13px; min-height: 2.6em; }
.c-side { display: grid; gap: 12px; min-width: 0; }
.c-slot:empty { display: none; }
.c-tally .c-lbl { font-size: 12px; color: var(--sub); letter-spacing: .08em; font-weight: 700; }
.c-count { display: flex; align-items: baseline; gap: 6px; margin: 2px 0; }
.c-count b { font: 700 76px/0.95 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.c-count span { font-size: 20px; font-weight: 700; }
.c-break { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.c-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--sub); margin: 8px 0 12px; }
.c-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); vertical-align: -2px; margin-right: 5px; }
.c-legend .one { background: #22a35a; } .c-legend .clump { background: #ef8a1f; } .c-legend .add { background: #2f6fd6; }
.c-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.c-acts .wide { grid-column: 1 / -1; }
.c-notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.c-notes:empty { display: none; }
.c-notes li { background: var(--note-bg); color: var(--note-ink); border-radius: 9px; padding: 9px 12px; font-size: 13px; }
.c-notes li.err { background: var(--warn-bg); color: var(--warn); }
.c-field { margin: 10px 0 12px; }
.c-field label { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; }
.c-field output { color: var(--pri); font-variant-numeric: tabular-nums; font-weight: 700; }
.c-adj input[type="range"] { width: 100%; accent-color: var(--pri); margin: 6px 0 0; height: 28px; }
.c-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }
.c-check { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; margin: 9px 0; cursor: pointer; }
.c-check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--pri); flex: none; }
.c-refs { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; display: grid; gap: 4px; }
.c-refline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); min-height: 30px; }
.c-link { background: none; border: 0; color: var(--pri); font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.c-tips ol { margin: 4px 0 0; padding-left: 1.3em; display: grid; gap: 7px; font-size: 13.5px; }
.c-tips b { color: var(--ink); }
@media (max-width: 900px) {
  .c-wrap { grid-template-columns: minmax(0, 1fr); }
  .c-stage { max-height: 64vh; }
}
@media (max-width: 520px) {
  .c-shoot { display: grid; grid-template-columns: 1fr 1fr; }
  .c-modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .c-count b { font-size: 64px; }
  .c-readout { left: 8px; top: 8px; padding: 2px 9px 3px; }
  .c-readout b { font-size: 28px; }
  .c-readout span { font-size: 12px; }
  .c-chip { right: 8px; top: 8px; }
  .c-zoom { right: 8px; bottom: 8px; gap: 4px; }
  .c-undo { left: 8px; bottom: 8px; }
  .c-zoom button, .c-undo { min-width: 40px; }
}

/* カウンタ単体の見出し */
.top { padding-block: 14px 12px; display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 10px; background: var(--pri); color: var(--pri-ink); display: grid; place-items: center; font: 700 28px/1 var(--f-text); flex: none; }
.top h1 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: .02em; text-wrap: balance; }
.top p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
main.wrap { padding-block: 0 28px; }
.save h2 { margin: 0 0 8px; font-size: 15px; }
.save .btn { width: 100%; margin-top: 10px; }
.privacy { font-size: 12px; color: var(--sub); margin: 0; }
.sheet-btns { display: flex; gap: 8px; flex: none; }
@media (max-width: 520px) { .top p { display: none; } }
</style>
</head>
<body>
<header class="wrap top">
  <div class="mark" aria-hidden="true">正</div>
  <div>
    <h1>予備品カウンタ</h1>
    <p>写真に写った部品の数を数えます。写真はこの端末の中だけで処理し、どこにも送りません。</p>
  </div>
</header>
<main class="wrap" id="counter"></main>
<template id="saveCard">
  <section class="card save">
    <h2>結果を残す</h2>
    <label class="lbl" for="memo">品名・置き場所など（画像の上に書き込みます）</label>
    <input class="inp" id="memo" type="text" autocomplete="off" placeholder="例：Oリング P-20 NBR　予備品庫 A-3">
    <button class="btn" id="saveImg" type="button">印つきの画像を保存</button>
  </section>
  <p class="privacy">写真の解析はこの画面の中だけで行います。保存は「印つきの画像を保存」を押したときだけです。</p>
</template>
<div class="sheet" id="sheet" hidden>
  <header><span id="sheetMsg">画像を長押し（右クリック）して保存してください</span>
    <span class="sheet-btns"><button class="btn pri" id="sheetShare" type="button" hidden>共有・保存</button><button class="btn" id="sheetClose" type="button">閉じる</button></span></header>
  <img id="sheetImg" alt="印をつけた結果の画像">
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* 予備品カウンタ：写真から物の数を数える処理（画面の部分とは別。ブラウザの中だけで動き、写真はどこにも送らない）
 *
 *   const P = CountEngine.prepare(imageData, {roi, bg})  背景との色の差の地図（重い）
 *   const S = CountEngine.segment(P, {sens})             しきい値で切り出し、かたまりに分ける
 *   const R = CountEngine.count(P, S, {minRatio, split, edge, refArea})  1個の大きさを決めて数え、印を置く（軽い）
 *
 * 座標は解析用画像の画素（左上が 0,0）。roi は {x0,y0,x1,y1}（x1,y1 は含まない）。
 * 数え方：背景の色（明るさのむらも追う）との差で部品を切り出し、つながったかたまりごとに
 *         「面積 ÷ 1個の面積」を四捨五入して個数にする（くっついていても数えられる）。
 */
const CountEngine = (() => {
  'use strict';

  const clampi = (v, a, b) => (v < a ? a : v > b ? b : v);

  // ---------- 色：sRGB → CIE Lab ----------
  const LIN = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const c = i / 255;
    LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  const fl = t => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 0.137931);

  function toLab(data, n) {
    const L = new Float32Array(n), A = new Float32Array(n), B = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      const r = LIN[data[j]], g = LIN[data[j + 1]], b = LIN[data[j + 2]];
      const x = fl((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047);
      const y = fl(0.2126 * r + 0.7152 * g + 0.0722 * b);
      const z = fl((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883);
      L[i] = 116 * y - 16;
      A[i] = 500 * (x - y);
      B[i] = 200 * (y - z);
    }
    return { L, A, B };
  }

  // ---------- 背景の色（いちばん多い色） ----------
  function globalBg(lab, w, roi) {
    const { L, A, B } = lab;
    const NL = 27, NA = 41, NB = 41; // L 0..108 / a,b -82..82（4 刻み）
    const hist = new Uint32Array(NL * NA * NB);
    const binOf = i => {
      const l = clampi((L[i] / 4) | 0, 0, NL - 1);
      const a = clampi(((A[i] + 82) / 4) | 0, 0, NA - 1);
      const b = clampi(((B[i] + 82) / 4) | 0, 0, NB - 1);
      return [l, a, b];
    };
    for (let y = roi.y0; y < roi.y1; y += 2)
      for (let x = roi.x0; x < roi.x1; x += 2) {
        const [l, a, b] = binOf(y * w + x);
        hist[(l * NA + a) * NB + b]++;
      }
    let best = -1, bl = 0, ba = 0, bb = 0;
    for (let l = 0; l < NL; l++)
      for (let a = 0; a < NA; a++)
        for (let b = 0; b < NB; b++) {
          if (!hist[(l * NA + a) * NB + b]) continue;
          let s = 0;
          for (let dl = -1; dl <= 1; dl++) {
            const ll = l + dl;
            if (ll < 0 || ll >= NL) continue;
            for (let da = -1; da <= 1; da++) {
              const aa = a + da;
              if (aa < 0 || aa >= NA) continue;
              for (let db = -1; db <= 1; db++) {
                const b2 = b + db;
                if (b2 < 0 || b2 >= NB) continue;
                s += hist[(ll * NA + aa) * NB + b2];
              }
            }
          }
          if (s > best) { best = s; bl = l; ba = a; bb = b; }
        }
    let n = 0, sl = 0, sa = 0, sb = 0;
    for (let y = roi.y0; y < roi.y1; y += 2)
      for (let x = roi.x0; x < roi.x1; x += 2) {
        const i = y * w + x, [l, a, b] = binOf(i);
        if (Math.abs(l - bl) <= 1 && Math.abs(a - ba) <= 1 && Math.abs(b - bb) <= 1) {
          n++; sl += L[i]; sa += A[i]; sb += B[i];
        }
      }
    if (!n) return { L: 90, A: 0, B: 0, spread: 3 };
    const m = { L: sl / n, A: sa / n, B: sb / n };
    let ss = 0;
    for (let y = roi.y0; y < roi.y1; y += 2)
      for (let x = roi.x0; x < roi.x1; x += 2) {
        const i = y * w + x, [l, a, b] = binOf(i);
        if (Math.abs(l - bl) <= 1 && Math.abs(a - ba) <= 1 && Math.abs(b - bb) <= 1) {
          const dl = L[i] - m.L, da = A[i] - m.A, db = B[i] - m.B;
          ss += dl * dl + da * da + db * db;
        }
      }
    m.spread = Math.sqrt(ss / n);
    return m;
  }

  // ---------- 場所ごとの背景（明るさのむらを、となりのます目へたどって追う） ----------
  function bgModel(lab, w, h, roi, bg, T0) {
    const { L, A, B } = lab;
    const cs = Math.max(12, Math.round(Math.max(w, h) / 24));
    const gw = Math.ceil(w / cs), gh = Math.ceil(h / cs), G = gw * gh;
    const cL = new Float32Array(G), cA = new Float32Array(G), cB = new Float32Array(G);
    const st = new Uint8Array(G); // 0 未定 1 実測 2 となりから
    const inRoi = new Uint8Array(G);
    const T2 = T0 * T0;
    function measure(ci, rl, ra, rb) {
      const gx = ci % gw, gy = (ci / gw) | 0;
      const xa = Math.max(roi.x0, gx * cs), xb = Math.min(roi.x1, gx * cs + cs);
      const ya = Math.max(roi.y0, gy * cs), yb = Math.min(roi.y1, gy * cs + cs);
      if (xa >= xb || ya >= yb) return null;
      let n = 0, k = 0, sl = 0, sa = 0, sb = 0;
      for (let y = ya; y < yb; y += 2)
        for (let x = xa; x < xb; x += 2) {
          const i = y * w + x;
          n++;
          const dl = L[i] - rl, da = A[i] - ra, db = B[i] - rb;
          if (dl * dl + da * da + db * db < T2) { k++; sl += L[i]; sa += A[i]; sb += B[i]; }
        }
      if (!n) return null;
      return k ? { frac: k / n, l: sl / k, a: sa / k, b: sb / k } : { frac: 0, l: rl, a: ra, b: rb };
    }
    const q = [];
    for (let ci = 0; ci < G; ci++) {
      const m = measure(ci, bg.L, bg.A, bg.B);
      if (!m) continue;
      inRoi[ci] = 1;
      if (m.frac >= 0.5) { st[ci] = 1; cL[ci] = m.l; cA[ci] = m.a; cB[ci] = m.b; q.push(ci); }
    }
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi], gx = c % gw, gy = (c / gw) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = gx + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = gy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
        const nc = ny * gw + nx;
        if (!inRoi[nc] || st[nc]) continue;
        let ws = 0, rl = 0, ra = 0, rb = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            const ax = nx + dx, ay = ny + dy;
            if (ax < 0 || ay < 0 || ax >= gw || ay >= gh) continue;
            const ac = ay * gw + ax;
            if (!st[ac]) continue;
            const wt = st[ac] === 1 ? 2 : 1;
            ws += wt; rl += cL[ac] * wt; ra += cA[ac] * wt; rb += cB[ac] * wt;
          }
        rl /= ws; ra /= ws; rb /= ws;
        const m = measure(nc, rl, ra, rb);
        if (m && m.frac >= 0.2) { st[nc] = 1; cL[nc] = m.l; cA[nc] = m.a; cB[nc] = m.b; }
        else { st[nc] = 2; cL[nc] = rl; cA[nc] = ra; cB[nc] = rb; }
        q.push(nc);
      }
    }
    // まだ決まらないます目（範囲の外など）は、となりから埋める
    for (let pass = 0; pass < gw + gh; pass++) {
      let left = 0;
      for (let c = 0; c < G; c++) {
        if (st[c]) continue;
        const gx = c % gw, gy = (c / gw) | 0;
        let ws = 0, rl = 0, ra = 0, rb = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            const ax = gx + dx, ay = gy + dy;
            if (ax < 0 || ay < 0 || ax >= gw || ay >= gh) continue;
            const ac = ay * gw + ax;
            if (st[ac] !== 1 && st[ac] !== 2) continue;
            ws++; rl += cL[ac]; ra += cA[ac]; rb += cB[ac];
          }
        if (ws) { cL[c] = rl / ws; cA[c] = ra / ws; cB[c] = rb / ws; st[c] = 3; } else left++;
      }
      for (let c = 0; c < G; c++) if (st[c] === 3) st[c] = 2;
      if (!left) break;
    }
    for (let c = 0; c < G; c++) if (!st[c]) { cL[c] = bg.L; cA[c] = bg.A; cB[c] = bg.B; }
    // ならす（実測を重く）
    const sL = new Float32Array(G), sA = new Float32Array(G), sB = new Float32Array(G);
    for (let gy = 0; gy < gh; gy++)
      for (let gx = 0; gx < gw; gx++) {
        let ws = 0, rl = 0, ra = 0, rb = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            const ax = gx + dx, ay = gy + dy;
            if (ax < 0 || ay < 0 || ax >= gw || ay >= gh) continue;
            const ac = ay * gw + ax;
            const wt = (st[ac] === 1 ? 2 : 1) * (dx || dy ? 1 : 2);
            ws += wt; rl += cL[ac] * wt; ra += cA[ac] * wt; rb += cB[ac] * wt;
          }
        const c = gy * gw + gx;
        sL[c] = rl / ws; sA[c] = ra / ws; sB[c] = rb / ws;
      }
    return { cs, gw, gh, cL: sL, cA: sA, cB: sB, measured: st };
  }

  // 背景との色の差（明るさの差も色の差も同じ重み）
  function diffMap(lab, w, h, roi, M) {
    const { L, A, B } = lab;
    const D = new Float32Array(w * h);
    const { cs, gw, gh, cL, cA, cB } = M;
    const xi0 = new Int32Array(w), xi1 = new Int32Array(w), xf = new Float32Array(w);
    for (let x = 0; x < w; x++) {
      let g = (x + 0.5) / cs - 0.5, a = Math.floor(g), f = g - a;
      if (a < 0) { a = 0; f = 0; }
      if (a >= gw - 1) { a = gw - 1; f = 0; }
      xi0[x] = a; xi1[x] = Math.min(gw - 1, a + 1); xf[x] = f;
    }
    for (let y = roi.y0; y < roi.y1; y++) {
      let g = (y + 0.5) / cs - 0.5, a = Math.floor(g), fy = g - a;
      if (a < 0) { a = 0; fy = 0; }
      if (a >= gh - 1) { a = gh - 1; fy = 0; }
      const r0 = a * gw, r1 = Math.min(gh - 1, a + 1) * gw;
      for (let x = roi.x0; x < roi.x1; x++) {
        const fx = xf[x], c00 = r0 + xi0[x], c01 = r0 + xi1[x], c10 = r1 + xi0[x], c11 = r1 + xi1[x];
        const w00 = (1 - fx) * (1 - fy), w01 = fx * (1 - fy), w10 = (1 - fx) * fy, w11 = fx * fy;
        const i = y * w + x;
        const dl = L[i] - (cL[c00] * w00 + cL[c01] * w01 + cL[c10] * w10 + cL[c11] * w11);
        const da = A[i] - (cA[c00] * w00 + cA[c01] * w01 + cA[c10] * w10 + cA[c11] * w11);
        const db = B[i] - (cB[c00] * w00 + cB[c01] * w01 + cB[c10] * w10 + cB[c11] * w11);
        D[i] = Math.sqrt(dl * dl + da * da + db * db);
      }
    }
    return D;
  }

  // 3×3 のならし（2回で近似ガウス）
  function blur3(src, w, h, roi) {
    const tmp = new Float32Array(src.length), out = new Float32Array(src.length);
    for (let y = roi.y0; y < roi.y1; y++) {
      const o = y * w;
      for (let x = roi.x0; x < roi.x1; x++) {
        const a = x > roi.x0 ? src[o + x - 1] : src[o + x], c = x < roi.x1 - 1 ? src[o + x + 1] : src[o + x];
        tmp[o + x] = (a + 2 * src[o + x] + c) * 0.25;
      }
    }
    for (let y = roi.y0; y < roi.y1; y++) {
      const o = y * w, up = y > roi.y0 ? o - w : o, dn = y < roi.y1 - 1 ? o + w : o;
      for (let x = roi.x0; x < roi.x1; x++) out[o + x] = (tmp[up + x] + 2 * tmp[o + x] + tmp[dn + x]) * 0.25;
    }
    return out;
  }

  // 大津のしきい値と、差の中央値
  function thresholdStats(D, w, roi) {
    const MAXV = 120, NB = 480, sc = NB / MAXV;
    const hist = new Float64Array(NB);
    let n = 0;
    for (let y = roi.y0; y < roi.y1; y++)
      for (let x = roi.x0; x < roi.x1; x++) {
        const v = D[y * w + x];
        hist[Math.min(NB - 1, (v * sc) | 0)]++;
        n++;
      }
    let acc = 0, med = 0, p90 = 0;
    for (let b = 0; b < NB; b++) {
      acc += hist[b];
      if (!med && acc >= n * 0.5) med = (b + 0.5) / sc;
      if (!p90 && acc >= n * 0.9) { p90 = (b + 0.5) / sc; break; }
    }
    let sum = 0;
    for (let b = 0; b < NB; b++) sum += b * hist[b];
    let wB = 0, sumB = 0, best = -1, tb = 0;
    for (let b = 0; b < NB; b++) {
      wB += hist[b];
      if (!wB) continue;
      const wF = n - wB;
      if (!wF) break;
      sumB += b * hist[b];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; tb = b; }
    }
    return { otsu: (tb + 1) / sc, med, p90 };
  }

  // ---------- 2値画像の処理 ----------
  function morph(src, w, h, r, dilate) {
    if (r <= 0) return src;
    const tmp = new Uint8Array(src.length), out = new Uint8Array(src.length);
    const S = new Int32Array(Math.max(w, h) + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) S[x + 1] = S[x] + src[o + x];
      for (let x = 0; x < w; x++) {
        const a = Math.max(0, x - r), b = Math.min(w, x + r + 1), s = S[b] - S[a];
        tmp[o + x] = dilate ? (s > 0 ? 1 : 0) : (s === b - a ? 1 : 0);
      }
    }
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) S[y + 1] = S[y] + tmp[y * w + x];
      for (let y = 0; y < h; y++) {
        const a = Math.max(0, y - r), b = Math.min(h, y + r + 1), s = S[b] - S[a];
        out[y * w + x] = dilate ? (s > 0 ? 1 : 0) : (s === b - a ? 1 : 0);
      }
    }
    return out;
  }

  // つながった部分に番号をつける（value の画素を、8近傍 or 4近傍で）
  function label(mask, w, h, value, conn8) {
    const lab = new Int32Array(w * h);
    let parent = new Int32Array(4096);
    let next = 1;
    const find = a => {
      while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; }
      return a;
    };
    const merge = (l, v) => {
      if (!v) return l;
      if (!l) return v;
      if (l === v) return l;
      const a = find(l), b = find(v);
      if (a === b) return a;
      if (a < b) { parent[b] = a; return a; }
      parent[a] = b;
      return b;
    };
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        const i = o + x;
        if (mask[i] !== value) continue;
        let l = 0;
        if (x > 0) l = merge(l, lab[i - 1]);
        if (y > 0) {
          l = merge(l, lab[i - w]);
          if (conn8) {
            if (x > 0) l = merge(l, lab[i - w - 1]);
            if (x < w - 1) l = merge(l, lab[i - w + 1]);
          }
        }
        if (!l) {
          if (next >= parent.length) {
            const np = new Int32Array(parent.length * 2);
            np.set(parent);
            parent = np;
          }
          parent[next] = next;
          l = next++;
        }
        lab[i] = l;
      }
    }
    const remap = new Int32Array(next);
    let n = 0;
    for (let k = 1; k < next; k++) {
      const r = find(k);
      if (!remap[r]) remap[r] = ++n;
      remap[k] = remap[r];
    }
    for (let i = 0; i < lab.length; i++) if (lab[i]) lab[i] = remap[lab[i]];
    return { lab, n };
  }

  function compStats(lab, n, w, h, roi, labC) {
    const comps = [];
    for (let k = 1; k <= n; k++)
      comps.push({ id: k, area: 0, sx: 0, sy: 0, x0: w, y0: h, x1: -1, y1: -1, edge: false, sL: 0, sA: 0, sB: 0 });
    for (let y = 0; y < h; y++) {
      const o = y * w;
      const ey = y <= roi.y0 || y >= roi.y1 - 1;
      for (let x = 0; x < w; x++) {
        const k = lab[o + x];
        if (!k) continue;
        const c = comps[k - 1];
        c.area++; c.sx += x; c.sy += y;
        if (x < c.x0) c.x0 = x;
        if (x > c.x1) c.x1 = x;
        if (y < c.y0) c.y0 = y;
        if (y > c.y1) c.y1 = y;
        if (ey || x <= roi.x0 || x >= roi.x1 - 1) c.edge = true;
        if (labC) { c.sL += labC.L[o + x]; c.sA += labC.A[o + x]; c.sB += labC.B[o + x]; }
      }
    }
    for (const c of comps) {
      c.cx = c.sx / c.area; c.cy = c.sy / c.area;
      if (labC) { c.L = c.sL / c.area; c.A = c.sA / c.area; c.B = c.sB / c.area; }
    }
    return comps;
  }

  // 1個の大きさ：面積の対数ヒストグラム（重み √面積）の山。
  //   欠けたかけら（大きさがばらばら）より、そろった大きさの「1個」が山になる。
  //   山の半分の大きさにも十分な山があれば、そちらが1個（いまの山は2個組）とみなす。
  function estimateRef(areas) {
    const a = areas.filter(x => x > 0).sort((p, q) => p - q);
    if (!a.length) return 0;
    if (a.length < 4) return a[a.length >> 1];
    const BW = 0.08, lo = Math.log2(a[0]) - 1, NBIN = Math.ceil((Math.log2(a[a.length - 1]) + 1 - lo) / BW) + 1;
    const hist = new Float64Array(NBIN);
    for (const x of a) hist[Math.round((Math.log2(x) - lo) / BW)] += Math.sqrt(x);
    const sm = new Float64Array(NBIN);
    for (let i = 0; i < NBIN; i++)
      for (let d = -4; d <= 4; d++) {
        const j = i + d;
        if (j >= 0 && j < NBIN) sm[i] += hist[j] * Math.exp(-(d * d) / (2 * 1.6 * 1.6));
      }
    let bi = 0;
    for (let i = 1; i < NBIN; i++) if (sm[i] > sm[bi]) bi = i;
    let ref = Math.pow(2, lo + bi * BW);
    const near = (r, tol) => a.filter(x => Math.abs(Math.log2(x / r)) < tol);
    for (let t = 0; t < 2; t++) {
      const half = ref / 2;
      const wHalf = near(half, 0.2).reduce((s, x) => s + Math.sqrt(x), 0);
      const wMain = near(ref, 0.2).reduce((s, x) => s + Math.sqrt(x), 0);
      if (wHalf >= 0.5 * wMain && near(half, 0.2).length >= 3) ref = half;
      else break;
    }
    // 仕上げ：整数倍に近いものだけで割り戻した中央値
    for (let it = 0; it < 4; it++) {
      const v = [];
      for (const x of a) {
        const r = x / ref, k = Math.round(r);
        if (r < 0.6 || k > 6 || Math.abs(r - k) > 0.3) continue;
        v.push(x / k);
      }
      if (v.length < 2) break;
      v.sort((p, q) => p - q);
      const nr = v[v.length >> 1];
      if (Math.abs(nr - ref) < 0.5) { ref = nr; break; }
      ref = nr;
    }
    return ref;
  }

  // 距離変換（チャンファー 3-4。値÷3 が画素）
  function chamfer(mask, w, h) {
    const d = new Uint16Array(w * h);
    for (let i = 0; i < d.length; i++) d[i] = mask[i] ? 60000 : 0;
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        const i = o + x;
        let v = d[i];
        if (!v) continue;
        if (x > 0 && d[i - 1] + 3 < v) v = d[i - 1] + 3;
        if (y > 0) {
          if (d[i - w] + 3 < v) v = d[i - w] + 3;
          if (x > 0 && d[i - w - 1] + 4 < v) v = d[i - w - 1] + 4;
          if (x < w - 1 && d[i - w + 1] + 4 < v) v = d[i - w + 1] + 4;
        }
        d[i] = v;
      }
    }
    for (let y = h - 1; y >= 0; y--) {
      const o = y * w;
      for (let x = w - 1; x >= 0; x--) {
        const i = o + x;
        let v = d[i];
        if (!v) continue;
        if (x < w - 1 && d[i + 1] + 3 < v) v = d[i + 1] + 3;
        if (y < h - 1) {
          if (d[i + w] + 3 < v) v = d[i + w] + 3;
          if (x < w - 1 && d[i + w + 1] + 4 < v) v = d[i + w + 1] + 4;
          if (x > 0 && d[i + w - 1] + 4 < v) v = d[i + w - 1] + 4;
        }
        d[i] = v;
      }
    }
    return d;
  }

  // ---------- 1. 色の差の地図 ----------
  function prepare(img, opt = {}) {
    const w = img.width, h = img.height, n = w * h;
    const roi = opt.roi
      ? { x0: clampi(Math.round(opt.roi.x0), 0, w - 1), y0: clampi(Math.round(opt.roi.y0), 0, h - 1),
          x1: clampi(Math.round(opt.roi.x1), 1, w), y1: clampi(Math.round(opt.roi.y1), 1, h) }
      : { x0: 0, y0: 0, x1: w, y1: h };
    const lab = toLab(img.data, n);
    const bg = opt.bg ? { L: opt.bg[0], A: opt.bg[1], B: opt.bg[2], spread: 3 } : globalBg(lab, w, roi);
    const T0 = clampi(2.5 * bg.spread + 6, 8, 22);
    const M = bgModel(lab, w, h, roi, bg, T0);
    // 解像度が高いほど細かいざらつきが増えるので、ならす回数を増やす
    let D = diffMap(lab, w, h, roi, M);
    const passes = Math.max(1, Math.round(Math.max(w, h) / 1280));
    for (let k = 0; k < passes; k++) D = blur3(D, w, h, roi);
    const ts = thresholdStats(D, w, roi);
    const scale = Math.max(w, h) / 1280;
    return { w, h, roi, lab, bg, T0, model: M, D, otsu: ts.otsu, med: ts.med, p90: ts.p90, scale };
  }

  // 感度 0〜100（50 がふつう）→ しきい値の倍率
  const sensFactor = s => Math.pow(2, (50 - s) / 40);

  // ---------- 2. 切り出し ----------
  function segment(P, opt = {}) {
    const { w, h, roi, D, scale } = P;
    const tmin = Math.max(6, 3 * P.med);
    const T = Math.max(tmin, P.otsu) * sensFactor(opt.sens == null ? 50 : opt.sens);
    // ヒステリシス：はっきりした所（> T）につながっている、うすい所（> Tlo）までを部品とする
    const tu = Object.assign({ lo: 0.5, c2: 0.12, c2max: 12, frag: 0.6, holeMax: 3 }, opt.tune || {});
    const Tlo = Math.max(3.5, 3 * P.med, tu.lo * T);
    const weak = new Uint8Array(w * h), strong = new Uint8Array(w * h);
    for (let y = roi.y0; y < roi.y1; y++)
      for (let x = roi.x0; x < roi.x1; x++) {
        const i = y * w + x;
        if (D[i] > Tlo) weak[i] = 1;
        if (D[i] > T) strong[i] = 1;
      }
    const LW = label(weak, w, h, 1, true);
    const keep = new Uint8Array(LW.n + 1);
    for (let i = 0; i < weak.length; i++) if (strong[i]) keep[LW.lab[i]] = 1;
    let mask = new Uint8Array(w * h);
    for (let i = 0; i < weak.length; i++) if (weak[i] && keep[LW.lab[i]]) mask[i] = 1;
    const rc = Math.max(1, Math.round(2 * scale)), ro = Math.max(1, Math.round(scale));
    mask = morph(morph(mask, w, h, rc, true), w, h, rc, false); // とじる（すき間を埋める）
    mask = morph(morph(mask, w, h, ro, false), w, h, ro, true); // ひらく（ごみを消す）
    const floor = Math.max(8, Math.round(25 * scale * scale));
    // 1回目：おおよその1個の大きさ
    let L1 = label(mask, w, h, 1, true);
    let c1 = compStats(L1.lab, L1.n, w, h, roi, null);
    const refRough = estimateRef(c1.filter(c => c.area >= floor).map(c => c.area));
    if (refRough > 0) {
      // 部品の大きさに合わせて、もう少し大きくとじる（光って欠けた輪郭をつなぐ）
      const rc2 = Math.min(Math.round(tu.c2max * scale), Math.round(tu.c2 * Math.sqrt(refRough)));
      if (rc2 > rc) {
        // 足すのは「欠けていそうなかたまり」のまわりだけ：1個に足りない、または整数個に半端な大きさ。
        // （1個分・2個分…とそろったもの同士はつなげない）
        const odd = new Uint8Array(c1.length + 1);
        for (const c of c1) {
          const r = c.area / refRough, f = Math.abs(r - Math.round(r));
          if (r < tu.frag || (r < 8 && f > 0.25)) odd[c.id] = 1;
        }
        const small = new Uint8Array(w * h);
        let any = false;
        for (let i = 0; i < mask.length; i++) {
          const k = L1.lab[i];
          if (k && odd[k]) { small[i] = 1; any = true; }
        }
        if (any) {
          const closed = morph(morph(mask, w, h, rc2, true), w, h, rc2, false);
          const zone = morph(small, w, h, rc2, true);
          for (let i = 0; i < mask.length; i++) if (closed[i] && zone[i]) mask[i] = 1;
          L1 = label(mask, w, h, 1, true);
          c1 = compStats(L1.lab, L1.n, w, h, roi, null);
        }
      }
      // 穴埋め：囲んでいる部品の 2.5 倍未満、1個の 4 倍未満の穴（座金・ナットの穴、光った面）
      const H = label(mask, w, h, 0, false);
      const harea = new Int32Array(H.n + 1), hedge = new Uint8Array(H.n + 1), henc = new Int32Array(H.n + 1);
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const i = y * w + x, k = H.lab[i];
          if (!k) continue;
          harea[k]++;
          if (x <= roi.x0 || y <= roi.y0 || x >= roi.x1 - 1 || y >= roi.y1 - 1) hedge[k] = 1;
          if (!henc[k] && x > 0 && L1.lab[i - 1]) henc[k] = L1.lab[i - 1];
        }
      for (let i = 0; i < mask.length; i++) {
        const k = H.lab[i];
        if (!k || hedge[k]) continue;
        const enc = henc[k] ? c1[henc[k] - 1].area : 0;
        if (harea[k] < 2.5 * enc && harea[k] < tu.holeMax * refRough) mask[i] = 1;
      }
    }
    const L2 = label(mask, w, h, 1, true);
    const comps = compStats(L2.lab, L2.n, w, h, roi, P.lab);
    const dist = chamfer(mask, w, h);
    for (const c of comps) { c.pd = -1; c.px = c.cx; c.py = c.cy; }
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        const k = L2.lab[o + x];
        if (!k) continue;
        const c = comps[k - 1], d = dist[o + x];
        if (d > c.pd) { c.pd = d; c.px = x; c.py = y; }
      }
    }
    return { T, tmin, mask, labels: L2.lab, comps, dist, floor, refRough };
  }

  // かたまりの中に k 個の印を置く（距離変換の山 → k-means）
  function placeMarkers(S, w, c, k, ref) {
    const { labels, dist } = S;
    const step = Math.max(1, Math.floor(Math.sqrt(c.area / 3000)));
    const px = [], py = [], peaks = [];
    for (let y = c.y0; y <= c.y1; y++)
      for (let x = c.x0; x <= c.x1; x++) {
        const i = y * w + x;
        if (labels[i] !== c.id) continue;
        if (x % step === 0 && y % step === 0) { px.push(x); py.push(y); }
        const d = dist[i];
        if (d < 6) continue;
        let top = true;
        for (let dy = -1; dy <= 1 && top; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const j = i + dy * w + dx;
            if (x + dx < c.x0 || x + dx > c.x1 || y + dy < c.y0 || y + dy > c.y1) continue;
            if (dist[j] > d) { top = false; break; }
          }
        if (top) peaks.push([d, x, y]);
      }
    if (!px.length) { px.push(Math.round(c.cx)); py.push(Math.round(c.cy)); }
    peaks.sort((a, b) => b[0] - a[0]);
    const dmin2 = 0.36 * ref; // (0.6√ref)²
    const cx = [], cy = [];
    for (const [, x, y] of peaks) {
      if (cx.length >= k) break;
      let ok = true;
      for (let j = 0; j < cx.length; j++) {
        const dx = cx[j] - x, dy = cy[j] - y;
        if (dx * dx + dy * dy < dmin2) { ok = false; break; }
      }
      if (ok) { cx.push(x); cy.push(y); }
    }
    while (cx.length < k) {
      let bi = 0, bd = -1;
      for (let i = 0; i < px.length; i++) {
        let md = Infinity;
        for (let j = 0; j < cx.length; j++) {
          const dx = cx[j] - px[i], dy = cy[j] - py[i], dd = dx * dx + dy * dy;
          if (dd < md) md = dd;
        }
        if (!cx.length) md = 1;
        if (md > bd) { bd = md; bi = i; }
      }
      cx.push(px[bi]); cy.push(py[bi]);
    }
    const asg = new Int32Array(px.length);
    for (let it = 0; it < 10; it++) {
      const sx = new Float64Array(k), sy = new Float64Array(k), sn = new Float64Array(k);
      for (let i = 0; i < px.length; i++) {
        let bj = 0, bd = Infinity;
        for (let j = 0; j < k; j++) {
          const dx = cx[j] - px[i], dy = cy[j] - py[i], dd = dx * dx + dy * dy;
          if (dd < bd) { bd = dd; bj = j; }
        }
        asg[i] = bj; sx[bj] += px[i]; sy[bj] += py[i]; sn[bj]++;
      }
      let moved = 0;
      for (let j = 0; j < k; j++) {
        if (!sn[j]) continue;
        const nx = sx[j] / sn[j], ny = sy[j] / sn[j];
        moved += Math.abs(nx - cx[j]) + Math.abs(ny - cy[j]);
        cx[j] = nx; cy[j] = ny;
      }
      if (moved < 0.5) break;
    }
    // かたまりの外に出た印は、いちばん近い画素へ
    const out = [];
    for (let j = 0; j < k; j++) {
      const xi = Math.round(cx[j]), yi = Math.round(cy[j]);
      if (xi >= 0 && yi >= 0 && labels[yi * w + xi] === c.id) { out.push([cx[j], cy[j]]); continue; }
      let bi = 0, bd = Infinity;
      for (let i = 0; i < px.length; i++) {
        const dx = cx[j] - px[i], dy = cy[j] - py[i], dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; bi = i; }
      }
      out.push([px[bi], py[bi]]);
    }
    return out;
  }

  const median = a => {
    if (!a.length) return 0;
    const s = a.slice().sort((p, q) => p - q);
    return s[s.length >> 1];
  };

  // ---------- 3. 数える ----------
  function count(P, S, opt = {}) {
    const minRatio = opt.minRatio == null ? 0.4 : opt.minRatio;
    const split = opt.split !== false, edge = opt.edge !== false;
    const comps = S.comps;
    const big = comps.filter(c => c.area >= S.floor);
    const refAuto = estimateRef(big.map(c => c.area));
    const ref = opt.refArea > 0 ? opt.refArea : refAuto;
    const res = { ref, refAuto, markers: [], status: new Uint8Array(comps.length + 1), k: new Int32Array(comps.length + 1),
      total: 0, clumps: 0, clumpObjs: 0, small: 0, excluded: 0, warnings: [] };
    if (!ref) { res.warnings.push('none'); return res; }
    // ふつうの1個の色（単独のかたまりの色の中央値）
    const singles = big.filter(c => Math.round(c.area / ref) === 1);
    const tL = median(singles.map(c => c.L)), tA = median(singles.map(c => c.A)), tB = median(singles.map(c => c.B));
    // status: 1 単独 2 くっつき 3 小さすぎ 4 除外（端・色ちがい・大きすぎ）
    for (const c of comps) {
      const r = c.area / ref;
      let st, k = 0;
      const dc = Math.sqrt((c.L - tL) ** 2 + (c.A - tA) ** 2 + (c.B - tB) ** 2);
      if (c.area < S.floor || r < minRatio) st = 3;
      else if (r >= 2.5 && singles.length >= 2 && dc > 25) st = 4;
      else if (edge && c.edge && r >= 2.5 && (dc > 15 || r > 12)) st = 4;
      else if (r > 80) st = 4;
      else { k = split ? Math.max(1, Math.round(r)) : 1; st = k > 1 ? 2 : 1; }
      res.status[c.id] = st;
      res.k[c.id] = k;
      if (st === 3) res.small++;
      if (st === 4) res.excluded++;
      if (st === 1) {
        // 重心が部品の上にあれば重心、外（輪の穴など）なら一番内側の点
        const xi = Math.round(c.cx), yi = Math.round(c.cy);
        const inside = S.labels[yi * P.w + xi] === c.id;
        res.markers.push({ x: inside ? c.cx : c.px, y: inside ? c.cy : c.py, comp: c.id, clump: false });
      }
      if (st === 2) {
        res.clumps++;
        res.clumpObjs += k;
        for (const [x, y] of placeMarkers(S, P.w, c, k, ref)) res.markers.push({ x, y, comp: c.id, clump: true });
      }
    }
    res.total = res.markers.length;
    // 注意
    const sa = singles.map(c => c.area);
    if (sa.length >= 5) {
      const m = sa.reduce((p, q) => p + q, 0) / sa.length;
      const sd = Math.sqrt(sa.reduce((p, q) => p + (q - m) * (q - m), 0) / sa.length);
      if (sd / m > 0.35) res.warnings.push('vary');
    }
    if (res.total && res.clumpObjs / res.total > 0.3) res.warnings.push('clumpy');
    if (res.excluded) res.warnings.push('excluded');
    if (res.total > 600) res.warnings.push('many');
    return res;
  }

  // =====================================================================
  // 見本で探す（形の照合）
  //   1個を囲んだ箱（box）を見本にして、写真の中から「同じ形・同じ色」のものを探す。
  //   背景に模様があっても、くっついていても、別の部品が混ざっていても数えられる。
  //   1) 見本の半径が約14画素になるよう縮める  2) 明るさ・輪郭の強さ・色(a,b) の4枚
  //   3) 同心の四角い輪ごとの平均（見本を4通りに回したもの）で、候補を粗くしぼる
  //   4) 候補ごとに見本を10°ずつ回して重ね合わせ（正規化相関）、色も比べて点をつける
  // =====================================================================
  function resizeTo(img, W, H) {
    const sw = img.width, sh = img.height, src = img.data;
    const out = new Uint8ClampedArray(W * H * 4);
    const fx = sw / W, fy = sh / H;
    if (fx >= 1 && fy >= 1) {
      // 縮小：画素の面積平均
      for (let y = 0; y < H; y++) {
        const y0 = Math.floor(y * fy), y1 = Math.max(y0 + 1, Math.floor((y + 1) * fy));
        for (let x = 0; x < W; x++) {
          const x0 = Math.floor(x * fx), x1 = Math.max(x0 + 1, Math.floor((x + 1) * fx));
          let r = 0, g = 0, b = 0, n = 0;
          for (let yy = y0; yy < y1 && yy < sh; yy++)
            for (let xx = x0; xx < x1 && xx < sw; xx++) {
              const j = (yy * sw + xx) * 4;
              r += src[j]; g += src[j + 1]; b += src[j + 2]; n++;
            }
          const o = (y * W + x) * 4;
          out[o] = r / n; out[o + 1] = g / n; out[o + 2] = b / n; out[o + 3] = 255;
        }
      }
    } else {
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          const sx = Math.min(sw - 1.001, Math.max(0, (x + 0.5) * fx - 0.5)), sy = Math.min(sh - 1.001, Math.max(0, (y + 0.5) * fy - 0.5));
          const x0 = Math.floor(sx), y0 = Math.floor(sy), ax = sx - x0, ay = sy - y0;
          const o = (y * W + x) * 4;
          for (let c = 0; c < 3; c++) {
            const p00 = src[(y0 * sw + x0) * 4 + c], p01 = src[(y0 * sw + x0 + 1) * 4 + c];
            const p10 = src[((y0 + 1) * sw + x0) * 4 + c], p11 = src[((y0 + 1) * sw + x0 + 1) * 4 + c];
            out[o + c] = (p00 * (1 - ax) + p01 * ax) * (1 - ay) + (p10 * (1 - ax) + p11 * ax) * ay;
          }
          out[o + 3] = 255;
        }
    }
    return { data: out, width: W, height: H };
  }

  function sobel(L, W, H) {
    const G = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        const gx = L[i - W + 1] + 2 * L[i + 1] + L[i + W + 1] - L[i - W - 1] - 2 * L[i - 1] - L[i + W - 1];
        const gy = L[i + W - 1] + 2 * L[i + W] + L[i + W + 1] - L[i - W - 1] - 2 * L[i - W] - L[i - W + 1];
        G[i] = Math.sqrt(gx * gx + gy * gy) * 0.125;
      }
    return G;
  }

  function normalize(a, floor) {
    let m = 0;
    for (let i = 0; i < a.length; i++) m += a[i];
    m /= a.length;
    let v = 0;
    for (let i = 0; i < a.length; i++) v += (a[i] - m) * (a[i] - m);
    const sd = Math.max(floor, Math.sqrt(v / a.length));
    const o = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) o[i] = (a[i] - m) / sd;
    return o;
  }

  // 箱形のならし（半径 r、積分画像で速く）
  function morphBlur(a, W, H, r) {
    const I = integralOf(a, W, H), W1 = W + 1, o = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
      for (let x = 0; x < W; x++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
        o[y * W + x] = (I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0]) / ((x1 - x0) * (y1 - y0));
      }
    }
    return o;
  }

  function integralOf(a, W, H) {
    const I = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) {
      let row = 0;
      for (let x = 0; x < W; x++) {
        row += a[y * W + x];
        I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row;
      }
    }
    return I;
  }

  // 写真の外は端の画素で埋めた、なめらかな読み取り
  function samp(ch, W, H, x, y) {
    if (x < 0) x = 0; else if (x > W - 1.001) x = W - 1.001;
    if (y < 0) y = 0; else if (y > H - 1.001) y = H - 1.001;
    const x0 = x | 0, y0 = y | 0, ax = x - x0, ay = y - y0, i = y0 * W + x0;
    return (ch[i] * (1 - ax) + ch[i + 1] * ax) * (1 - ay) + (ch[i + W] * (1 - ax) + ch[i + W + 1] * ax) * ay;
  }

  function match(img, box, opt = {}) {
    const t0 = Date.now();
    const bw = Math.max(4, box.x1 - box.x0), bh = Math.max(4, box.y1 - box.y0);
    const R0 = 0.5 * Math.max(bw, bh);
    const tu = Object.assign({ rt: 20, wc: 0.2, gate: 0.5, neg: false, pos: true, spacing: 1, nrf: 0.12, it: 8, offMax: 0.25, spanMin: 0.65 }, opt.tune || {});
    const s = Math.min(1, Math.max(0.08, tu.rt / R0));
    const W = Math.max(16, Math.round(img.width * s)), H = Math.max(16, Math.round(img.height * s));
    const sm = resizeTo(img, W, H);
    const lab = toLab(sm.data, W * H);
    const full = { x0: 0, y0: 0, x1: W, y1: H };
    const Lc = blur3(lab.L, W, H, full);
    const Gc = sobel(Lc, W, H);
    const Ac = lab.A, Bc = lab.B;
    const cx = (box.x0 + box.x1) / 2 * s, cy = (box.y0 + box.y1) / 2 * s;
    const hw = bw * s / 2, hh = bh * s / 2;

    // --- 見本の形：箱の中で、箱のふちの色とちがう所（真ん中につながる所） ---
    const mx0 = Math.max(0, Math.floor(cx - hw)), mx1 = Math.min(W, Math.ceil(cx + hw));
    const my0 = Math.max(0, Math.floor(cy - hh)), my1 = Math.min(H, Math.ceil(cy + hh));
    const mw = mx1 - mx0, mh = my1 - my0;
    const brd = [[], [], []];
    for (let y = my0; y < my1; y++)
      for (let x = mx0; x < mx1; x++) {
        if (y > my0 && y < my1 - 1 && x > mx0 && x < mx1 - 1) continue;
        const i = y * W + x;
        brd[0].push(lab.L[i]); brd[1].push(Ac[i]); brd[2].push(Bc[i]);
      }
    const bgc = brd.map(a => median(a));
    // 模様（縞鋼板のつぶなど）をならしてから比べる
    const rb = Math.max(1, Math.round(0.12 * Math.min(hw, hh)));
    const sL = morphBlur(lab.L, W, H, rb), sA = morphBlur(Ac, W, H, rb), sB = morphBlur(Bc, W, H, rb);
    for (let k = 0; k < 3; k++) brd[k].length = 0;
    for (let y = my0; y < my1; y++)
      for (let x = mx0; x < mx1; x++) {
        if (y > my0 + 1 && y < my1 - 2 && x > mx0 + 1 && x < mx1 - 2) continue;
        const i = y * W + x;
        brd[0].push(sL[i]); brd[1].push(sA[i]); brd[2].push(sB[i]);
      }
    const bgs = brd.map(a => median(a));
    const dbox = new Float32Array(mw * mh);
    for (let y = 0; y < mh; y++)
      for (let x = 0; x < mw; x++) {
        const i = (y + my0) * W + x + mx0;
        dbox[y * mw + x] = Math.hypot(sL[i] - bgs[0], sA[i] - bgs[1], sB[i] - bgs[2]);
      }
    const ts = thresholdStats(dbox, mw, { x0: 0, y0: 0, x1: mw, y1: mh });
    let bm = new Uint8Array(mw * mh);
    for (let i = 0; i < bm.length; i++) if (dbox[i] > Math.max(4, ts.otsu)) bm[i] = 1;
    bm = morph(morph(bm, mw, mh, 1, true), mw, mh, 1, false);
    const LB = label(bm, mw, mh, 1, true);
    let keepId = LB.lab[Math.round(mh / 2) * mw + Math.round(mw / 2)];
    if (!keepId) {
      const cnt = new Int32Array(LB.n + 1);
      for (let i = 0; i < bm.length; i++) cnt[LB.lab[i]]++;
      for (let k = 1; k <= LB.n; k++) if (!keepId || cnt[k] > cnt[keepId]) keepId = k;
    }
    let mask = new Uint8Array(mw * mh), marea = 0;
    for (let i = 0; i < bm.length; i++) if (keepId && LB.lab[i] === keepId) { mask[i] = 1; marea++; }
    // 穴を埋める
    if (marea) {
      const HL = label(mask, mw, mh, 0, false), edgeH = new Uint8Array(HL.n + 1);
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if ((!x || !y || x === mw - 1 || y === mh - 1) && HL.lab[y * mw + x]) edgeH[HL.lab[y * mw + x]] = 1;
      for (let i = 0; i < mask.length; i++) if (HL.lab[i] && !edgeH[HL.lab[i]]) { mask[i] = 1; marea++; }
    }
    let maskKind = 'shape';
    // 見本は箱のまん中にあるはず。切り出した形の重心が大きくずれていたら、背景とまぎれて一部しか取れていない
    //   また、囲んだ箱の縦か横のどちらかは、ほぼ部品の大きさのはず（両方とも6割に届かなければ一部しか取れていない）
    let off = 0, span = 1;
    if (marea) {
      let sx = 0, sy = 0, x0 = mw, x1 = -1, y0 = mh, y1 = -1;
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (mask[y * mw + x]) {
        sx += x; sy += y;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      const bcx = cx - mx0 - 0.5, bcy = cy - my0 - 0.5;
      off = Math.max(Math.abs(sx / marea - bcx) / Math.max(1, hw), Math.abs(sy / marea - bcy) / Math.max(1, hh));
      span = Math.max((x1 - x0 + 1) / mw, (y1 - y0 + 1) / mh);
    }
    if (marea < 0.12 * mw * mh || marea > 0.97 * mw * mh || off > tu.offMax || span < tu.spanMin) {
      maskKind = 'ellipse';
      marea = 0;
      for (let y = 0; y < mh; y++)
        for (let x = 0; x < mw; x++) {
          const u = (x + mx0 + 0.5 - cx) / hw, v = (y + my0 + 0.5 - cy) / hh;
          mask[y * mw + x] = u * u + v * v <= 1 ? 1 : 0;
          marea += mask[y * mw + x];
        }
    }
    const foot0 = mask.slice();   // 1個の外形（二重に数えないための重なり判定に使う）
    const marg = Math.max(1, Math.round(0.1 * Math.sqrt(marea)));
    mask = morph(mask, mw, mh, marg, true);   // 輪郭のまわりも少し入れる
    const inMask = (x, y) => {   // 見本の画像上の座標
      const xi = Math.round(x - mx0 - 0.5), yi = Math.round(y - my0 - 0.5);
      return xi >= 0 && yi >= 0 && xi < mw && yi < mh && mask[yi * mw + xi] === 1;
    };
    let Rm = 3;
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (mask[y * mw + x]) Rm = Math.max(Rm, Math.hypot(x + mx0 + 0.5 - cx, y + my0 + 0.5 - cy));
    Rm = Math.ceil(Rm);

    // --- 粗いしぼり込み：同心円の輪の平均（回しても変わらない）。明るさの違いは引き算と割り算で消す ---
    const K = 6;
    const ringIdx = [], ringDx = [], ringDy = [];
    for (let k = 0; k < K; k++) { ringIdx.push([]); ringDx.push([]); ringDy.push([]); }
    for (let dy = -Rm; dy <= Rm; dy++)
      for (let dx = -Rm; dx <= Rm; dx++) {
        const r = Math.hypot(dx, dy);
        if (r > Rm) continue;
        const k = Math.min(K - 1, Math.floor(r / Rm * K));
        ringIdx[k].push(dy * W + dx); ringDx[k].push(dx); ringDy[k].push(dy);
      }
    const prof = new Float64Array(2 * K);
    const profileAt = (x, y) => {
      const inside = x >= Rm && y >= Rm && x < W - Rm && y < H - Rm, i0 = y * W + x;
      for (let k = 0; k < K; k++) {
        let sL = 0, sG = 0;
        const ids = ringIdx[k], n = ids.length;

        return u;
      });
      const drop = new Uint8Array(got.length);
      for (let k = got.length - 1; k >= 0; k--) {   // got は点数の高い順
        if (!D[k]) continue;
        const c = got[k];
        let n = 0;
        for (let j = 0; j < c.sup.length; j++) if (cnt[c.sup[j]] >= 2) n++;
        if (n > postT * c.sup.length) {
          drop[k] = 1;
          for (const i of D[k]) cnt[i]--;
          if (o.trace) o.trace.push([Math.round(c.x), Math.round(c.y), +c.score.toFixed(2), +(n / c.sup.length).toFixed(2), -1, -1, 2, c.sup.length]);
        }
      }
      return got.filter((c, k) => !drop[k]);
    }
    return got;
  }

  // その点のかたまり（なければ 0）。r 画素以内の近くも探す
  function compAt(S, w, h, x, y, r = 4) {
    const xi = Math.round(x), yi = Math.round(y);
    let best = 0, bd = Infinity;
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        const xx = xi + dx, yy = yi + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const k = S.labels[yy * w + xx];
        if (k && dx * dx + dy * dy < bd) { bd = dx * dx + dy * dy; best = k; }
      }
    return best ? S.comps[best - 1] : null;
  }

  // その点のまわりの色（Lab の平均）
  function colorAt(P, x, y, r = 4) {
    const { w, h, lab } = P;
    let n = 0, l = 0, a = 0, b = 0;
    for (let yy = Math.round(y) - r; yy <= Math.round(y) + r; yy++)
      for (let xx = Math.round(x) - r; xx <= Math.round(x) + r; xx++) {
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const i = yy * w + xx;
        n++; l += lab.L[i]; a += lab.A[i]; b += lab.B[i];
      }
    return n ? [l / n, a / n, b / n] : null;
  }

  return { prepare, segment, count, compAt, colorAt, sensFactor, match, pickMatches };
})();
if (typeof module !== 'undefined') module.exports = CountEngine;

</script>
